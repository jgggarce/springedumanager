# Nombre de la aplicacion
spring.application.name=SpringEduManager

# Puerto propio para no chocar con Tomcat/otros proyectos que usen el 8080
server.port=8081

# Base de datos H2 embebida (archivo local, se crea sola al arrancar)
spring.datasource.url=jdbc:h2:file:~/springedumanager/eduDb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2, util para revisar los datos durante el desarrollo
# Disponible en http://localhost:8081/h2-console (JDBC URL de arriba)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: desactivar la cache de plantillas mientras se desarrolla
spring.thymeleaf.cache=false

# Usuarios de demostracion para Spring Security (Leccion 4)
app.security.admin.username=admin
app.security.admin.password=admin123
app.security.user.username=estudiante
app.security.user.password=user123
