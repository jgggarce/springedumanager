<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SpringEduManager - Ingreso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="contenedor-login">
    <h1>SpringEduManager</h1>
    <p class="subtitulo">Gestion de estudiantes, cursos y evaluaciones</p>

    <p class="mensaje-error" th:if="${param.error}">Correo o contrasena incorrectos.</p>
    <p class="mensaje-ok" th:if="${param.logout}">Sesion cerrada correctamente.</p>

    <form class="formulario" th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required autofocus="autofocus"/>

        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" required/>

        <button type="submit">Ingresar</button>
    </form>

    <p class="ayuda">
        Administrador: <strong>admin</strong> / <strong>admin123</strong><br/>
        Usuario: <strong>estudiante</strong> / <strong>user123</strong>
    </p>
</div>
</body>
</html>
