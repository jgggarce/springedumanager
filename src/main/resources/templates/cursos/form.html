<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo curso</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="contenedor contenedor-angosto">
    <h1>Nuevo curso</h1>
    <p class="subtitulo">Solo un usuario con rol ADMIN puede crear cursos.</p>

    <form class="formulario" th:action="@{/cursos/nuevo}" th:object="${curso}" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required/>
        <p class="mensaje-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</p>

        <label for="descripcion">Descripcion</label>
        <input type="text" id="descripcion" th:field="*{descripcion}"/>

        <label for="duracionHoras">Duracion (horas)</label>
        <input type="number" id="duracionHoras" th:field="*{duracionHoras}" min="1"/>

        <button type="submit">Guardar</button>
    </form>
</div>
</body>
</html>
