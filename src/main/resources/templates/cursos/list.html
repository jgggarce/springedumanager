<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cursos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="contenedor">
    <div class="encabezado">
        <h1>Cursos</h1>
        <a class="boton-link" sec:authorize="hasRole('ADMIN')" th:href="@{/cursos/nuevo}">+ Nuevo curso</a>
    </div>

    <table class="tabla">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Duracion (hrs)</th>
            <th sec:authorize="hasRole('ADMIN')"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="curso : ${cursos}">
            <td th:text="${curso.nombre}">Nombre</td>
            <td th:text="${curso.descripcion}">Descripcion</td>
            <td th:text="${curso.duracionHoras}">0</td>
            <td sec:authorize="hasRole('ADMIN')">
                <form th:action="@{/cursos/{id}/eliminar(id=${curso.id})}" method="post">
                    <button type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
