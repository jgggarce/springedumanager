# nombre de la aplicacion
spring.application.name=SpringEduManager


server.port=8081

#
spring.datasource.url=jdbc:h2:file:~/springedumanager/eduDb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.thymeleaf.cache=false


app.security.admin.username=admin
app.security.admin.password=admin123
app.security.user.username=estudiante
app.security.user.password=user123
